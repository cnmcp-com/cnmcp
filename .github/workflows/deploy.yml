name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://api.cnmcp.com/health
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - name: Validate deployment credentials
        run: node scripts/check-cloudflare-prerequisites.mjs
      - name: Test and type-check
        run: |
          npm run test -w @cnmcp/api
          npm run typecheck -w @cnmcp/api
      - name: Build API Worker
        run: npm run build -w @cnmcp/api
      - name: Apply production D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply cnmcp --remote
      - name: Deploy API Worker
        working-directory: apps/api
        run: npx wrangler deploy
      - name: Verify API health
        run: node scripts/smoke-deployment.mjs https://api.cnmcp.com/health api

  web:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - name: Validate deployment credentials
        run: node scripts/check-cloudflare-prerequisites.mjs
      - name: Type-check web
        run: npm run typecheck -w @cnmcp/web
      - name: Build Web Worker
        env:
          API_URL: https://api.cnmcp.com
          NEXT_PUBLIC_API_URL: https://api.cnmcp.com
          NEXT_PUBLIC_SITE_URL: https://www.cnmcp.com
        run: npm run build:worker -w @cnmcp/web
      - name: Validate Web Worker bundle
        working-directory: apps/web
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Deploy Web Worker
        working-directory: apps/web
        run: npx wrangler deploy
