name: Build and verify CNMCP GitHub login
on:
  push:
    branches: [release/oauth-f29c295]
permissions:
  contents: read
concurrency:
  group: cnmcp-web-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:worker
      - name: Upload frontend version
        working-directory: apps/web
        run: npx --no-install wrangler versions upload --config wrangler.jsonc --preview-alias oauth-f29c295
      - name: Verify login page and OAuth routes on preview
        run: |
          node scripts/smoke-deployment.mjs https://oauth-f29c295-cnmcp-web.burgleaf.workers.dev
          node scripts/verify-oauth-release.mjs https://oauth-f29c295-cnmcp-web.burgleaf.workers.dev
      - name: Verify official domain after Cloudflare cutover
        run: |
          for attempt in $(seq 1 36); do
            if node scripts/verify-oauth-release.mjs https://www.cnmcp.com; then
              node scripts/smoke-deployment.mjs https://www.cnmcp.com
              exit 0
            fi
            sleep 10
          done
          exit 1
