name: Verify live CNMCP GitHub login
on:
  push:
    branches: [release/oauth-f29c295]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Verify production GitHub OAuth
        run: node scripts/verify-oauth-release.mjs https://www.cnmcp.com
      - name: Verify production website
        run: node scripts/smoke-deployment.mjs https://www.cnmcp.com
