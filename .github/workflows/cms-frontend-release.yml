name: Verify live CMS and content MCP
on:
  push:
    branches: [release/cms-e7cfa77]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: node scripts/smoke-deployment.mjs https://www.cnmcp.com
      - name: Check CMS, MCP and existing OAuth on production
        run: node scripts/cms-live-release-smoke.mjs
