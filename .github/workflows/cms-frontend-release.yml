name: Build and verify CMS public website integration
on:
  push:
    branches: [release/cms-e7cfa77]
permissions:
  contents: read
concurrency:
  group: cnmcp-web-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:worker
      - name: Upload the frontend candidate
        working-directory: apps/web
        run: npx --no-install wrangler versions upload --config wrangler.jsonc --preview-alias cms-e7cfa77
      - name: Verify the preview website
        run: node scripts/smoke-deployment.mjs https://cms-e7cfa77-cnmcp-web.burgleaf.workers.dev
