name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build API Worker
        run: npm run build -w @cnmcp/api
      - name: Build Web Worker
        env:
          API_URL: https://api.cnmcp.com
          NEXT_PUBLIC_API_URL: https://api.cnmcp.com
          NEXT_PUBLIC_SITE_URL: https://www.cnmcp.com
        run: npm run build:worker -w @cnmcp/web
