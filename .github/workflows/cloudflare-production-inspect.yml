name: Inspect CNMCP Cloudflare production
on:
  push:
    branches: [release/cloudflare-production-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect hostnames, Worker versions and public endpoints
        run: |
          node --input-type=module <<'JS'
          const base = 'https://api.cloudflare.com/client/v4';
          const account = '/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN };
          async function request(path) {
            const resp = await fetch(base + path, { headers, signal: AbortSignal.timeout(15000) });
            const { result, errors } = await resp.json();
            return { status: resp.status, errors: errors?.map(v => [v.code, v.message]), result };
          }
          async function inspect(label, path, map) {
            try {
              const { status, errors, result } = await request(path);
              console.log(JSON.stringify({ label, status, errors, data: result && map(result) }));
              return result;
            } catch (e) {
              console.log(JSON.stringify({ label, error: e.message }));
            }
          }
          const domainCheck = inspect('Worker domains', account + '/workers/domains?zone_name=cnmcp.com', data =>
            data.map(d => ({ hostname: d.hostname, service: d.service, enabled: d.enabled })));
          const deployments = ['cnmcp-web','cnmcp-server','cnmcp-server-v2'].map(name => Promise.all([
            inspect(name + ' deployments', account + '/workers/scripts/' + name + '/deployments', data =>
              (data.deployments || data).slice(0, 2).map(d => ({ versions: d.versions, created: d.created_on }))),
            inspect(name + ' bindings', account + '/workers/scripts/' + name + '/settings', data => ({
              bindings: data.bindings?.map(b => ({ name: b.name, type: b.type, service: b.type === 'service' ? b.service : undefined }))
            }))
          ]));
          const zone = inspect('Zone', '/zones?name=cnmcp.com', data => data.map(z => ({ name: z.name, status: z.status }))).then(async zones => {
            const id = zones?.[0]?.id;
            if (!id) return;
            await Promise.all([
              inspect('Worker routes', '/zones/' + id + '/workers/routes', data => data.map(r => ({ pattern: r.pattern, script: r.script }))),
              inspect('Website DNS', '/zones/' + id + '/dns_records?name=www.cnmcp.com', data =>
                data.map(r => ({ type: r.type, name: r.name, content: r.content, proxied: r.proxied })))
            ]);
          });
          async function probe(origin, path) {
            try {
              const resp = await fetch(origin + path, { signal: AbortSignal.timeout(15000), redirect: 'manual' });
              const body = await resp.text();
              let version, code, domains;
              try { const data = JSON.parse(body); ({ version, domains } = data); code = data.error?.code; } catch {}
              console.log(JSON.stringify({ origin, path, status: resp.status, title: body.match(/<title>(.*?)<\/title>/)?.[1], version,
                domains: Array.isArray(domains) ? domains.length : domains, code, newLogo: body.includes('cnmcp-icon.svg?v=2'),
                location: resp.headers.get('location')?.split('?')[0] }));
            } catch (e) { console.log(JSON.stringify({ origin, path, error: e.message })); }
          }
          const probes = ['https://www.cnmcp.com','https://cnmcp-web.burgleaf.workers.dev',
            'https://logo-dba9a36-cnmcp-web.burgleaf.workers.dev'].flatMap(origin =>
            ['/','/health','/api/v1/taxonomy','/auth/github/start'].map(path => probe(origin, path)));
          await Promise.all([domainCheck, zone, ...deployments, ...probes]);
          JS
