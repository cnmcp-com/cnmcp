name: Verify CNMCP preview and production
on:
  push:
    branches: [release/cloudflare-community-web]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Verify the frontend preview
        run: node scripts/smoke-deployment.mjs https://community-fdc44b4-cnmcp-web.burgleaf.workers.dev
      - name: Verify the production cutover
        run: |
          for attempt in $(seq 1 36); do
            if node scripts/smoke-deployment.mjs https://www.cnmcp.com; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Check GitHub login availability
        run: |
          node --input-type=module <<'JS'
          const url = 'https://www.cnmcp.com/auth/github/start';
          const response = await fetch(url, {redirect:'manual', signal:AbortSignal.timeout(15000)});
          const location = response.headers.get('location');
          const github = !!location && new URL(location).hostname === 'github.com';
          console.log('GitHub OAuth start: HTTP ' + response.status + '; redirects to GitHub: ' + github);
          JS
