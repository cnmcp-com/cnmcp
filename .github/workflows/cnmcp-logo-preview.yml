name: Verify the CNMCP logo preview
on:
  push:
    branches: [release/logo-preview-dba9a36]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify the published SVG and inspect the homepage
        run: |
          curl -fsS --max-time 20 --retry 2 --retry-all-errors 'https://logo-dba9a36-cnmcp-web.burgleaf.workers.dev/cnmcp-icon.svg?v=2' -o /tmp/cnmcp-logo.svg
          cmp /tmp/cnmcp-logo.svg apps/web/public/cnmcp-icon.svg
          echo 'Preview alias SVG matches the committed logo'
          curl -fsS --max-time 20 'https://d0372b6a-cnmcp-web.burgleaf.workers.dev/cnmcp-icon.svg?v=2' -o /tmp/cnmcp-logo-version.svg
          cmp /tmp/cnmcp-logo-version.svg apps/web/public/cnmcp-icon.svg
          echo 'Version URL SVG matches the committed logo'
          curl -fsS --max-time 20 'https://logo-dba9a36-cnmcp-web.burgleaf.workers.dev/' -o /tmp/cnmcp-home.html
          if grep -q 'class="brand"' /tmp/cnmcp-home.html && grep -q '/cnmcp-icon.svg?v=2' /tmp/cnmcp-home.html; then
            echo 'Homepage renders the new brand and icon'
          else
            echo 'Homepage did not render the new brand'
            if grep -q '社区暂时无法加载' /tmp/cnmcp-home.html; then
              echo 'Homepage reported the community backend is unavailable'
            fi
            exit 1
          fi
